name: Build Workbench
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test and build
        run: ./gradlew verifyWorkbenchIsolation test :platform:android:workbench:assembleDebug :platform:desktop:workbench:installDist --stacktrace
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libfreetype-dev pkg-config fonts-wqy-zenhei libgl1 libegl1
      - name: Exercise the generic editor
        run: |
          tools/build-host-native.sh
          timeout 180s xvfb-run -a ./gradlew :platform:desktop:workbench:editorSmokeTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-${{ github.sha }}
          path: |
            platform/android/workbench/build/outputs/apk/debug/*.apk
            **/build/test-results/**/*.xml
            platform/desktop/workbench/build/editor-smoke-home/
